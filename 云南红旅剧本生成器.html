<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云南红旅沉浸式剧本生成器</title>
  <style>
/* 云南红旅沉浸式剧本生成器 - 红色主题样式 */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #c0392b;
  --primary-dark: #922b21;
  --primary-light: #e74c3c;
  --gold: #d4af37;
  --gold-light: #f4d03f;
  --bg-dark: #1a1a1a;
  --bg-light: #fdf6e3;
  --text-dark: #2c3e50;
  --text-light: #7f8c8d;
  --border: #e0e0e0;
}

body {
  font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
  background: linear-gradient(135deg, #fdf6e3 0%, #f5e6d3 100%);
  color: var(--text-dark);
  line-height: 1.6;
  min-height: 100vh;
}

/* 顶部横幅 */
.header {
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
  color: white;
  padding: 32px 20px;
  text-align: center;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(192, 57, 43, 0.3);
}

.header::before {
  content: "★";
  position: absolute;
  font-size: 200px;
  opacity: 0.08;
  top: -30px;
  right: 30px;
  color: var(--gold);
}

.header::after {
  content: "★";
  position: absolute;
  font-size: 120px;
  opacity: 0.06;
  bottom: -20px;
  left: 40px;
  color: white;
}

.header h1 {
  font-size: 32px;
  margin-bottom: 8px;
  letter-spacing: 4px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
  position: relative;
  z-index: 1;
}

.header .subtitle {
  font-size: 15px;
  opacity: 0.92;
  letter-spacing: 2px;
  position: relative;
  z-index: 1;
}

.header .star-divider {
  color: var(--gold-light);
  margin: 0 8px;
}

/* 主体容器 */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}

/* 控制面板 */
.control-panel {
  background: white;
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
  margin-bottom: 24px;
  border: 2px solid var(--gold);
}

.panel-title {
  font-size: 20px;
  color: var(--primary);
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px dashed var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.form-group {
  display: flex;
  flex-direction: column;
}

.form-group label {
  font-size: 14px;
  color: var(--text-light);
  margin-bottom: 6px;
  font-weight: 600;
}

.form-group select,
.form-group input {
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-size: 15px;
  transition: all 0.3s;
  background: #fafafa;
}

.form-group select:focus,
.form-group input:focus {
  outline: none;
  border-color: var(--primary);
  background: white;
  box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.1);
}

.form-group.full-width {
  grid-column: 1 / -1;
}

/* 生成按钮 */
.generate-btn {
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 4px;
  box-shadow: 0 4px 14px rgba(192, 57, 43, 0.35);
  margin-top: 8px;
}

.generate-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(192, 57, 43, 0.45);
}

.generate-btn:active {
  transform: translateY(0);
}

/* 操作按钮组 */
.action-buttons {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.action-btn {
  padding: 10px 20px;
  border: 2px solid var(--primary);
  background: white;
  color: var(--primary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.3s;
}

.action-btn:hover {
  background: var(--primary);
  color: white;
}

/* 加载动画 */
.loading {
  text-align: center;
  padding: 60px 20px;
}

.loading .spinner {
  width: 60px;
  height: 60px;
  border: 5px solid var(--border);
  border-top: 5px solid var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loading p {
  color: var(--primary);
  font-size: 16px;
  letter-spacing: 2px;
}

/* 结果区域 */
#resultArea {
  background: white;
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
}

.hidden {
  display: none !important;
}

/* 剧本头部 */
.script-header {
  text-align: center;
  padding: 24px;
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
  color: white;
  border-radius: 12px;
  margin-bottom: 28px;
}

.script-title {
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 4px;
  margin-bottom: 12px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

.script-meta {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 12px;
}

.script-meta .tag {
  background: var(--gold);
  color: var(--primary-dark);
  padding: 4px 14px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 14px;
}

.meta-item {
  font-size: 14px;
  opacity: 0.95;
}

.generated-at {
  font-size: 12px;
  opacity: 0.7;
}

/* 章节样式 */
.script-section {
  margin-bottom: 28px;
}

.section-title {
  font-size: 20px;
  color: var(--primary);
  padding: 10px 0 10px 14px;
  border-left: 5px solid var(--gold);
  background: linear-gradient(90deg, rgba(212, 175, 55, 0.1) 0%, transparent 100%);
  border-radius: 0 8px 8px 0;
  margin-bottom: 16px;
}

.title-icon {
  margin-right: 8px;
}

.section-content {
  padding: 0 8px;
  line-height: 1.8;
}

.sub-title {
  font-weight: bold;
  color: var(--primary-dark);
  margin: 8px 0 4px;
}

.list-item {
  padding-left: 16px;
  position: relative;
}

.list-item::before {
  content: "▸";
  position: absolute;
  left: 0;
  color: var(--primary);
}

/* 角色卡片 */
.character-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

.character-card {
  display: flex;
  gap: 12px;
  padding: 16px;
  background: linear-gradient(135deg, #fff9f0 0%, #fff 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  transition: all 0.3s;
}

.character-card:hover {
  box-shadow: 0 4px 12px rgba(192, 57, 43, 0.15);
  transform: translateY(-2px);
}

.char-avatar {
  width: 50px;
  height: 50px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
  flex-shrink: 0;
}

.char-info {
  flex: 1;
}

.char-name {
  font-size: 16px;
  font-weight: bold;
  color: var(--primary-dark);
  margin-bottom: 2px;
}

.fiction-tag {
  font-size: 11px;
  background: #95a5a6;
  color: white;
  padding: 1px 8px;
  border-radius: 10px;
  margin-left: 4px;
}

.real-tag {
  font-size: 11px;
  background: #27ae60;
  color: white;
  padding: 1px 8px;
  border-radius: 10px;
  margin-left: 4px;
}

.char-identity {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 6px;
}

.char-desc {
  font-size: 13px;
  margin-bottom: 6px;
  color: var(--text-dark);
}

.char-task,
.char-clue {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 2px;
}

/* 分幕卡片 */
.act-card {
  background: #fafafa;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 14px;
  border-left: 4px solid var(--primary);
}

.act-title {
  font-size: 17px;
  font-weight: bold;
  color: var(--primary);
  margin-bottom: 10px;
}

.act-duration {
  font-size: 12px;
  color: var(--text-light);
  font-weight: normal;
  margin-left: 8px;
}

.act-content {
  line-height: 1.8;
  font-size: 14px;
}

.scene-meta {
  display: flex;
  gap: 16px;
  font-size: 13px;
  color: var(--text-light);
  margin: 8px 0;
  flex-wrap: wrap;
}

.stage-direction {
  font-style: italic;
  color: #8e6f3e;
  background: #fff8e7;
  padding: 8px 12px;
  border-radius: 6px;
  margin: 8px 0;
  font-size: 13px;
}

.scene-content {
  line-height: 1.9;
  white-space: pre-wrap;
}

.scene-audio {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 8px;
  font-style: italic;
}

/* 线索卡 */
.clue-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}

.clue-card {
  background: linear-gradient(135deg, #fffbf0 0%, #fff5e0 100%);
  border: 1px solid #e8d5a3;
  border-radius: 8px;
  padding: 14px;
  position: relative;
}

.clue-num {
  font-size: 11px;
  color: var(--gold);
  font-weight: bold;
  margin-bottom: 4px;
}

.clue-type {
  display: inline-block;
  background: var(--primary);
  color: white;
  font-size: 11px;
  padding: 2px 10px;
  border-radius: 10px;
  margin-bottom: 8px;
}

.clue-content {
  font-size: 13px;
  line-height: 1.6;
}

/* 机制卡片 */
.mechanism-card {
  background: #f0f8ff;
  border: 1px solid #b8d4e3;
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 10px;
}

.mech-name {
  font-weight: bold;
  color: #2471a3;
  margin-bottom: 4px;
}

.mech-desc {
  font-size: 14px;
  color: var(--text-dark);
}

/* 精神卡片 */
.spirit-section {
  background: linear-gradient(135deg, rgba(192, 57, 43, 0.03) 0%, rgba(212, 175, 55, 0.05) 100%);
  border-radius: 12px;
  padding: 20px;
}

.spirit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}

.spirit-card {
  text-align: center;
  padding: 16px 12px;
  background: white;
  border-radius: 10px;
  border: 1px solid var(--gold);
  box-shadow: 0 2px 8px rgba(212, 175, 55, 0.15);
}

.spirit-name {
  font-size: 17px;
  font-weight: bold;
  color: var(--primary);
  margin-bottom: 6px;
}

.spirit-desc {
  font-size: 12px;
  color: var(--text-light);
  line-height: 1.5;
}

/* 关卡卡片 */
.level-card {
  background: linear-gradient(135deg, #f0fff4 0%, #fff 100%);
  border: 1px solid #a9dfbf;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 16px;
}

.level-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.level-num {
  background: var(--primary);
  color: white;
  padding: 4px 12px;
  border-radius: 16px;
  font-size: 13px;
  font-weight: bold;
}

.level-name {
  font-size: 17px;
  font-weight: bold;
  color: var(--primary-dark);
}

.level-location {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 6px;
}

.level-knowledge {
  font-size: 13px;
  color: #1e8449;
  margin-bottom: 12px;
}

.question-block {
  background: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 10px;
}

.question-block.challenge {
  border-left: 4px solid #e67e22;
  background: #fef9e7;
}

.q-level {
  font-size: 12px;
  color: var(--primary);
  font-weight: bold;
  margin-bottom: 4px;
}

.q-text {
  font-size: 14px;
  margin-bottom: 8px;
}

.q-options {
  margin-bottom: 8px;
}

.q-option {
  font-size: 13px;
  padding: 2px 0;
}

.q-answer {
  font-size: 13px;
  color: #196f3d;
  margin-top: 6px;
}

.q-analysis {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 4px;
}

.level-task {
  margin-top: 10px;
  padding: 10px;
  background: #fef9e7;
  border-radius: 6px;
  font-size: 13px;
}

/* 关卡地图 */
.level-map-box {
  background: linear-gradient(135deg, #f0f8ff 0%, #e8f4f8 100%);
  border: 1px solid #b8d4e3;
  border-radius: 10px;
  padding: 16px 18px;
}

.map-route {
  font-size: 15px;
  color: #1a5276;
  margin-bottom: 8px;
  line-height: 1.6;
}

.map-distance {
  font-size: 13px;
  color: #2471a3;
  margin-bottom: 12px;
  font-weight: bold;
}

.map-locations {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.map-loc-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: white;
  border-radius: 6px;
  border-left: 3px solid #2471a3;
  font-size: 13px;
  flex-wrap: wrap;
}

.map-loc-order {
  width: 24px;
  height: 24px;
  background: #2471a3;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 12px;
  flex-shrink: 0;
}

.map-loc-name {
  font-weight: bold;
  color: #1a5276;
}

.map-loc-type {
  font-size: 11px;
  color: #2471a3;
  background: #d4e6f1;
  padding: 1px 8px;
  border-radius: 8px;
}

.map-loc-knowledge {
  font-size: 12px;
  color: #666;
  margin-left: auto;
}

/* 实物任务 */
.physical-task {
  margin: 12px 0;
  padding: 12px 14px;
  background: linear-gradient(135deg, #fef9e7 0%, #fdebd0 100%);
  border: 1px solid #f5cba7;
  border-radius: 8px;
}

.task-header {
  font-weight: bold;
  color: #b9770e;
  margin-bottom: 6px;
  font-size: 14px;
}

.task-desc {
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 6px;
}

.task-item {
  font-size: 12px;
  color: #7e5109;
  font-style: italic;
}

.level-desc {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 10px;
}

/* 装备包清单 */
.equipment-category {
  margin-bottom: 14px;
}

.equip-cat-name {
  font-size: 15px;
  font-weight: bold;
  color: var(--primary);
  margin-bottom: 6px;
  padding-left: 8px;
  border-left: 3px solid var(--gold);
}

/* 积分规则全宽项 */
.scoring-item.full-width {
  grid-column: 1 / -1;
}

/* 一句话定位 */
.positioning-box {
  background: linear-gradient(135deg, #fff9f0 0%, #fef5e7 100%);
  border-left: 4px solid var(--gold);
  padding: 18px 22px;
  border-radius: 0 10px 10px 0;
  font-size: 16px;
  line-height: 1.8;
  color: var(--primary-dark);
  font-weight: 500;
}

/* 玩法选择卡片 */
.gameplay-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  margin-bottom: 10px;
  border-left: 4px solid var(--primary);
}

.gameplay-type {
  display: inline-block;
  background: var(--primary);
  color: white;
  padding: 2px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 6px;
}

.gameplay-name {
  font-size: 16px;
  font-weight: bold;
  color: var(--primary-dark);
  margin-bottom: 4px;
}

.gameplay-reason {
  font-size: 13px;
  color: var(--text-dark);
  line-height: 1.6;
}

/* 关卡地图表格 */
.map-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  font-size: 13px;
}

.map-table th {
  background: var(--primary);
  color: white;
  padding: 8px 10px;
  text-align: left;
  font-size: 12px;
}

.map-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.map-table tr:nth-child(even) td {
  background: #fafafa;
}

/* 题目元信息 */
.q-meta {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 6px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.verified-badge {
  display: inline-block;
  background: #27ae60;
  color: white;
  padding: 1px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: bold;
}

/* 实物任务详情网格 */
.task-detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
  font-size: 12px;
}

.task-detail-grid > div:nth-child(3) {
  grid-column: 1 / -1;
}

/* 四档评奖 */
.awards-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.award-card {
  background: linear-gradient(135deg, #fdf6e3 0%, #faf0d7 100%);
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 14px 10px;
  text-align: center;
}

.award-tier {
  font-size: 18px;
  font-weight: bold;
  color: var(--primary-dark);
  margin-bottom: 6px;
}

.award-condition {
  font-size: 12px;
  color: #8e6f3e;
  margin-bottom: 6px;
}

.award-prize {
  font-size: 12px;
  color: var(--text-dark);
}

/* 装备包表格 */
.equip-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 8px;
}

.equip-table th {
  background: #5d6d7e;
  color: white;
  padding: 8px 10px;
  text-align: left;
  font-size: 12px;
}

.equip-table td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
}

.equip-table tr:nth-child(even) td {
  background: #f8f9fa;
}

.equip-required {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 8px;
  font-size: 11px;
  font-weight: bold;
}

.equip-required.req {
  background: #e74c3c;
  color: white;
}

.equip-required.opt {
  background: #95a5a6;
  color: white;
}

/* 终局仪式 */
.ending-box {
  background: linear-gradient(135deg, #f0fff4 0%, #eafaf1 100%);
  border: 1px solid #a9dfbf;
  border-radius: 10px;
  padding: 18px;
}

.ending-meta {
  font-size: 14px;
  color: #1e8449;
  margin-bottom: 12px;
}

.ending-stages {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 12px 0;
}

.ending-stage {
  display: flex;
  gap: 12px;
  padding: 10px;
  background: white;
  border-radius: 8px;
}

.stage-order {
  width: 30px;
  height: 30px;
  background: #27ae60;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  flex-shrink: 0;
}

.stage-info {
  flex: 1;
}

.stage-name {
  font-weight: bold;
  color: #1e8449;
  font-size: 14px;
}

.stage-duration {
  font-size: 12px;
  color: #5d6d7e;
  font-weight: normal;
}

.stage-content {
  font-size: 13px;
  color: var(--text-dark);

/* 积分规则 */
.scoring-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.scoring-item {
  display: flex;
  justify-content: space-between;
  padding: 10px 14px;
  background: #f8f9fa;
  border-radius: 8px;
  font-size: 13px;

  font-weight: bold;
  color: var(--primary);

}

.props-list li::before {
  content: "✦";

  left: 4px;

.props-list li:last-child {
  border-bottom: none;

/* 开场收尾 */

  padding: 14px;

  margin-bottom: 12px;

.opening-box {
  background: #fef9e7;
  border-left: 4px solid var(--gold);

.closing-box {
  background: #f0fff4;
  border-left: 4px solid #27ae60;
}

  padding: 40px 20px;
  background: #fff5f5;
  border: 2px solid #f5b7b1;
  border-radius: 12px;

  color: var(--primary);
  margin-bottom: 12px;
}

/* 页脚 */

  text-align: center;
  padding: 24px;
  color: var(--text-light);
  font-size: 13px;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}

  color: var(--gold);
}

/* 响应式 */
@media (max-width: 768px) {
  .form-row {
    grid-template-columns: 1fr;

  .header h1 {
    font-size: 24px;
  }

  .script-title {
    font-size: 22px;
  }

  .scoring-grid {
    grid-template-columns: 1fr;

  align-items: center;
  justify-content: center;
}

.mg-rhythm-pads {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}

.mg-pad {
  padding: 20px 8px;
  background: #f0f0f0;
  border: 3px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.mg-pad-emoji {
  font-size: 32px;
}

.mg-pad-name {
  font-size: 13px;
  font-weight: bold;
  color: var(--text-dark);
}

.mg-pad-active {
  transform: scale(1.1);
  background: #fff3cd;
  border-color: #f4d03f;
  box-shadow: 0 0 20px rgba(244, 208, 63, 0.6);
}

.mg-rhythm-tip {
  text-align: center;
  font-size: 13px;
  color: var(--text-light);
  margin-top: 16px;
}

/* 打靶游戏 */
.mg-target-game {
  max-width: 700px;
  margin: 0 auto;
}

.mg-target-field {
  position: relative;
  height: 360px;
  background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 60%, #228b22 60%, #2e8b57 100%);
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid #2e8b57;
  cursor: crosshair;
}

.mg-target {
  position: absolute;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  user-select: none;
  transition: transform 0.1s;
}

.mg-target:hover {
  transform: scale(1.2);
}

/* 翻牌记忆游戏 */
.mg-memory {
  max-width: 700px;
  margin: 0 auto;
}

.mg-memory-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.mg-card {
  aspect-ratio: 3/4;
  perspective: 1000px;
  cursor: pointer;
}

.mg-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.4s;
  transform-style: preserve-3d;
}

.mg-card.mg-flipped .mg-card-inner {
  transform: rotateY(180deg);
}

.mg-card-front, .mg-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: bold;
  text-align: center;
  padding: 8px;
}

.mg-card-front {
  background: linear-gradient(135deg, #c0392b 0%, #e74c3c 100%);
  color: white;
  font-size: 28px;
}

.mg-card-back {
  background: white;
  color: var(--text-dark);
  transform: rotateY(180deg);
  border: 2px solid var(--gold);
}

.mg-card-back.desc {
  font-size: 11px;
  line-height: 1.4;
}

/* 物资运输游戏 */
.mg-logistics {
  max-width: 700px;
  margin: 0 auto;
}

.mg-logistics-field {
  position: relative;
  height: 300px;
  background: linear-gradient(180deg, #87ceeb 0%, #87ceeb 40%, #deb887 40%, #deb887 100%);
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid #cd853f;
}

.mg-bridge {
  position: absolute;
  top: 42%;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 24px;
  z-index: 5;
}

.mg-truck-lane {
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  height: 50px;
}

.mg-truck {
  position: absolute;
  top: 0;
  font-size: 36px;
  cursor: pointer;
  z-index: 10;
  user-select: none;
}

.mg-truck:hover {
  transform: scale(1.15);
}

.mg-bomber-zone {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 40%;
}

.mg-bomb {
  position: absolute;
  font-size: 28px;
  cursor: pointer;
  z-index: 8;
  user-select: none;
}

@keyframes mg-bomb-fall {
  from { top: 0; }
  to { top: 100%; }
}

/* 飘字特效 */
.mg-float-text {
  position: absolute;
  transform: translateX(-50%);
  font-size: 24px;
  font-weight: bold;
  pointer-events: none;
  z-index: 100;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
  animation: mg-float-up 1s ease-out forwards;
}

@keyframes mg-float-up {
  0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  50% { opacity: 1; transform: translateX(-50%) translateY(-30px) scale(1.2); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-60px) scale(0.8); }
}

/* 屏幕震动 */
@keyframes mg-shake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(calc(var(--shake-intensity, 4px) * -1), var(--shake-intensity, 4px)); }
  40% { transform: translate(var(--shake-intensity, 4px), calc(var(--shake-intensity, 4px) * -1)); }
  60% { transform: translate(calc(var(--shake-intensity, 4px) * -1), calc(var(--shake-intensity, 4px) * -1)); }
  80% { transform: translate(var(--shake-intensity, 4px), var(--shake-intensity, 4px)); }
}

/* 连击高亮 */
.mg-topbar span:last-child {
  transition: all 0.2s;
}

/* 小游戏响应式 */
@media (max-width: 600px) {
  .btn-group {

    grid-template-columns: repeat(5, 1fr);
  }
  .mg-memory-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  .mg-scenario {
    font-size: 15px;
  }

/* 打印样式 */
@media print {

    border: none;
  }

  }

function generateQuizAdventure(spot) {
  const events = spot.events;
  const figures = spot.figures;
  const layout = spot.layout;
  const stationCount = Math.min(layout.length, 8);

  // 生成各站点
  const stations = layout.slice(0, stationCount).map((place, idx) => {
    const event = events[idx % events.length];
    const figure = figures[idx % figures.length];
    return generateStation(place, event, figure, spot, idx, stationCount);
  });

  return {
    type: "问答闯关类",
    name: `${spot.name}探路行动`,
    spot: spot.name,
    duration: "约120分钟",
    players: "不限（建议4-8人/队）",
    difficulty: "★★★",
    // 段落0：一句话定位
    positioning: generatePositioning(spot),
    // 段落1：地点判断与玩法选择
    gameplaySelection: generateGameplaySelection(spot),
    // 段落2：关卡地图
    levelMap: generateLevelMap9(spot, stations),
    // 段落3+4：分站题库 + 实物任务
    stations: stations,
    // 段落5：积分与评奖
    scoring: generateScoring9(stationCount),
    // 段落6：装备包清单
    equipmentPack: generateEquipmentPack9(),
    // 段落7：终局仪式
    endingCeremony: generateEndingCeremony9(spot),
    // 段落8：落地待办
    todos: generateTodos(spot),
    spirit: generateSpirit(spot)
  };
}

// 段落1：地点判断与玩法选择
function generateGameplaySelection(spot) {
  const type = spot.type;

  };

// 生成单个站点（含关卡地图信息 + 题库 + 实物任务）
function generateStation(place, event, figure, spot, idx, total) {
  const isFirst = idx === 0;

  return {
    order: idx + 1,
    name: place.name,
    location: place.name,
    narrative: isFirst

function generateTodos(spot) {

    `【待补】实物任务中的"拍照"环节，需确认${spot.name}是否允许拍摄（部分展陈可能禁止）。`,
    `【待补】装备包清单的单价为估算值，需根据实际采购渠道更新。`,
    `【待补】终局仪式的宣誓誓词可根据主办方要求调整。`,
    `【假设】参与人数按每队4-8人、共4-8队设计；若人数变化需调整物资数量。`,
    `【假设】${spot.name}开放时间内允许开展团队活动，需提前与场馆方沟通确认。`
  ];

// 数组打乱工具
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ==================== 类型自动判断 ====================
function detectScriptType(spot, userRequest) {
  const request = userRequest || "";

  // 用户明确指定类型
  if (request.includes("剧本杀") || request.includes("推理")) return "剧本杀类";
  if (request.includes("剧情") || request.includes("演绎") || request.includes("舞台剧") || request.includes("表演")) return "剧情演绎类";
  if (request.includes("问答") || request.includes("闯关") || request.includes("答题") || request.includes("打卡")) return "问答闯关类";

  // 根据景区类型自动判断
  return spot.recommendedScript;
}

// ==================== 主生成入口 ====================
function generateScript(spotName, scriptType, userRequest) {
  const spot = knowledgeBase[spotName];
  if (!spot) {
    return {
      error: true,
      message: `知识库中暂未收录"${spotName}"的史料，请选择其他景区或补充资料。`
    };
  }

  const type = scriptType === "自动判断" ? detectScriptType(spot, userRequest) : scriptType;

  let script;
  switch (type) {
    case "剧本杀类":
      script = generateMurderMystery(spot);
      break;
    case "剧情演绎类":
      script = generateDramaScript(spot);
      break;
    case "问答闯关类":
      script = generateQuizAdventure(spot);
      break;
    default:
      script = generateMurderMystery(spot);
  }

  return {
    error: false,
    type: type,
    spot: spot,
    script: script,
    generatedAt: new Date().toLocaleString("zh-CN")
  };
}

  // 模拟生成延迟（提升体验感）
  setTimeout(() => {
    const result = generateScript(spotName, scriptType, userRequest);
    loadingArea.classList.add("hidden");

    if (result.error) {
      resultArea.innerHTML = `
        <div class="error-box">
          <h3>⚠️ 提示</h3>
          <p>${result.message}</p>
          <p style="margin-top:12px;font-size:14px;color:#666;">当前已收录景区：${scenicSpotList.join("、")}</p>
        </div>
      `;
      resultArea.classList.remove("hidden");
      return;
    }

    // 渲染剧本
    renderScript(result);
    resultArea.classList.remove("hidden");
    actionButtons.classList.remove("hidden");
  }, 1500);
}

// 工具函数：格式化文本
function formatText(text) {
  if (!text) return "";
  return text
    .split("\n")
    .map(line => {
      const trimmed = line.trim();
      if (!trimmed) return "<br>";
      // 标题行
      if (/^[一二三四五六七八九十]+[、.]/.test(trimmed)) {
        return `<div class="sub-title">${trimmed}</div>`;
      }
      // 列表项
      if (/^[-•]/.test(trimmed)) {
        return `<div class="list-item">${trimmed.replace(/^[-•]\s*/, "")}</div>`;
      }
      return `<div>${trimmed}</div>`;
    })
    .join("");
}

// 导出为Markdown
function exportMarkdown() {
  const text = resultArea.innerText;
  const title = document.querySelector(".script-title")?.textContent || "红旅剧本";
  const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${title}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

// 游戏状态

// 根据景区生成闯关题目
function generateGameQuestions(spot) {
  const questions = [];
  const events = spot.events;
  const figures = spot.figures;
  const layout = spot.layout;

  // 题库1：景区基本信息
  questions.push({
    q: `${spot.name}位于云南省哪个州市？`,
    options: generateOptions(spot.location.split("省")[1]?.split("市")[0]?.split("州")[0]?.trim() || "昭通", ["昆明", "大理", "丽江", "昭通", "玉溪", "保山", "曲靖", "红河"]),
    answer: spot.location,
    analysis: `${spot.name}位于${spot.location}，是${spot.level}。`
  });

  // 题库2：历史时期
  questions.push({
    q: `${spot.name}的核心历史事件发生在什么时期？`,
    options: generateOptions(spot.period, ["1935年2月", "1937-1945年", "1942-1945年", "1909-1935年", "1912-1935年"]),
    answer: spot.period,
    analysis: `${spot.name}的历史可追溯至${spot.period}。`
  });

  // 题库3：核心事件（来自events）
  events.slice(0, 4).forEach(evt => {
    const wrongOptions = events.filter(e => e.title !== evt.title).map(e => e.title);
    questions.push({
      q: `${evt.date}，在${evt.location}发生的历史事件是？`,
      options: generateOptions(evt.title, [...wrongOptions, "以上都不是", "遵义会议", "长征出发", "秋收起义"]),
      answer: evt.title,
      analysis: `${evt.date}，${evt.title}。${evt.content.substring(0, 80)}……`
    });
  });

  // 题库4：重要人物
  figures.slice(0, 3).forEach(fig => {
    questions.push({
      q: `在${spot.name}的历史中，${fig.name}的身份是？`,
      options: generateOptions(fig.role, figures.filter(f => f.name !== fig.name).map(f => f.role)),
      answer: fig.role,
      analysis: `${fig.name}，${fig.role}。${fig.desc.substring(0, 60)}`
    });
  });

  // 题库5：景区布局
  if (layout.length > 0) {
    questions.push({
      q: `以下哪一项是${spot.name}的组成部分？`,
      options: generateOptions(layout[0].name, layout.slice(1).map(l => l.name).concat(["天安门广场", "故宫博物院", "西湖"])),
      answer: layout[0].name,
      analysis: `${layout[0].name}是${spot.name}的重要组成部分。${layout[0].desc}`
    });
  }

  // 题库6：特色元素
  if (spot.elements.length > 0) {
    questions.push({
      q: `${spot.name}的特色历史元素不包括以下哪一项？`,
      options: generateOptions("兵马俑", [...spot.elements, "红军标语", "赤水河"]),
      answer: "兵马俑",
      analysis: `${spot.name}的特色元素包括：${spot.elements.join("、")}。兵马俑是西安秦始皇陵的文物。`
    });
  }

  // 打乱题目顺序，取前10题
  return shuffleArray(questions).slice(0, Math.min(10, questions.length));
}

// 生成选项（正确答案 + 干扰项，共4个）
function generateOptions(correctAnswer, wrongPool) {
  const wrongs = shuffleArray(wrongPool.filter(w => w && w !== correctAnswer)).slice(0, 3);
  const all = shuffleArray([correctAnswer, ...wrongs]);
  return all;
}

// 数组打乱
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 处理答题
function handleAnswer(idx) {
  const state = gameState;
  const q = state.questions[state.currentIndex];
  const selected = q.options[idx];
  const isCorrect = selected === q.answer;

  if (isCorrect) {
    state.score += 10;
    state.correctCount++;
  }
  state.answers.push({ question: q.q, selected, correct: q.answer, isCorrect });

  // 显示反馈
  const options = document.querySelectorAll(".option-btn");
  options.forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove("correct", "wrong");
    if (q.options[i] === q.answer) {
      btn.classList.add("correct");
    } else if (i === idx) {
      btn.classList.add("wrong");
    }
  });

  // 显示解析
  const feedback = document.createElement("div");
  feedback.className = `answer-feedback ${isCorrect ? "feedback-correct" : "feedback-wrong"}`;
  feedback.innerHTML = `
    <div class="feedback-icon">${isCorrect ? "✅" : "❌"}</div>
    <div class="feedback-content">
      <div class="feedback-title">${isCorrect ? "回答正确！" : "回答错误"}</div>
      <div class="feedback-analysis">${q.analysis}</div>
    </div>
  `;
  document.querySelector(".question-card").appendChild(feedback);

  // 添加下一题按钮
  const nextBtn = document.createElement("button");
  nextBtn.className = "next-btn";
  const isLast = state.currentIndex === state.questions.length - 1;
  nextBtn.textContent = isLast ? "🏆 查看结果" : "➡️ 下一题";
  nextBtn.onclick = () => {
    if (isLast) {
      renderGameResult();
    } else {
      state.currentIndex++;
      renderGameQuestion();
    }
  };
  document.querySelector(".question-card").appendChild(nextBtn);
}

// ==================== 音效系统（Web Audio API，无需音频文件） ====================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  return audioCtx;
}

function playSound(type) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);

  switch (type) {
    case "hit":
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
      break;
    case "shoot":
      osc.type = "square";
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
      break;
    case "combo":
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
      break;
    case "correct":
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.1);
      osc.frequency.setValueAtTime(784, now + 0.2);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
      break;
    case "wrong":
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
      break;
    case "win":
      const notes = [523, 659, 784, 1047];
      notes.forEach((f, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f;
        g.gain.setValueAtTime(0.15, now + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.2);
        o.start(now + i * 0.12); o.stop(now + i * 0.12 + 0.2);
      });
      break;
    case "click":
      osc.frequency.setValueAtTime(1000, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
      break;
  }
}

  updateShootHUD();

function renderRhythmGame() {

  miniGameArea.innerHTML = `

      <div class="mg-topbar">
        <span>📍 聂耳故居 · 音符记忆</span>
        <span>回合：${s.round} | 得分：${s.score}</span>
      </div>
      <div class="mg-rhythm-display" id="rhythmDisplay">准备好了吗？观察音符序列…</div>
      <div class="mg-rhythm-pads">
        ${s.notes.map(n => `
          <button class="mg-pad" data-note="${n}" onclick="playNote('${n}')">
            <span class="mg-pad-emoji">${s.emojis[n]}</span>
            <span class="mg-pad-name">${n}</span>
          </button>
        `).join("")}
      </div>
      <div class="mg-rhythm-tip">记住亮起的音符顺序，然后依次点击复现！</div>
    </div>
  `;
}

function startRhythmRound() {
  const s = miniGame.state;
  s.accepting = false;
  s.playerSeq = [];
  s.sequence.push(s.notes[Math.floor(Math.random() * s.notes.length)]);
  const display = document.getElementById("rhythmDisplay");
  display.textContent = "👀 观察序列...";

  let i = 0;
  const showNext = () => {
    if (i >= s.sequence.length) {
      display.textContent = "👆 轮到你了！按顺序点击音符";
      s.accepting = true;
      return;
    }
    const note = s.sequence[i];
    playNoteSound(note);
    const pad = document.querySelector(`.mg-pad[data-note="${note}"]`);
    if (pad) pad.classList.add("mg-pad-active");
    setTimeout(() => {
      if (pad) pad.classList.remove("mg-pad-active");
      i++;
      setTimeout(showNext, 200);
    }, 500);
  };
  setTimeout(showNext, 600);
}

// 音符频率映射（C大调）
const noteFreqs = { do: 261.63, re: 293.66, mi: 329.63, sol: 392.00, la: 440.00 };

function playNoteSound(note) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const freq = noteFreqs[note] || 440;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.frequency.value = freq;
  osc.type = "sine";
  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
  osc.start(); osc.stop(ctx.currentTime + 0.4);
}

function playNote(note) {
  const s = miniGame.state;
  if (!s.accepting) return;
  playNoteSound(note);
  const pad = document.querySelector(`.mg-pad[data-note="${note}"]`);
  if (pad) { pad.classList.add("mg-pad-active"); setTimeout(() => pad.classList.remove("mg-pad-active"), 200); }
  s.playerSeq.push(note);
  const idx = s.playerSeq.length - 1;
  if (s.playerSeq[idx] !== s.sequence[idx]) {
    s.accepting = false;
    playSound("wrong");
    const display = document.getElementById("rhythmDisplay");
    display.textContent = "❌ 错误！序列结束";
    setTimeout(() => showMiniGameResult(s.score, 100, "音符记忆结束", `你坚持到了第 ${s.round} 回合，复现了 ${s.score} 个音符。`, s.score >= 15 ? "🏆" : s.score >= 8 ? "🎖️" : "🎵"), 1200);
    return;
  }
  s.score++;
  if (s.playerSeq.length === s.sequence.length) {
    s.accepting = false;
    playSound("correct");
    s.round++;
    const display = document.getElementById("rhythmDisplay");
    display.textContent = "✅ 正确！下一回合...";
    setTimeout(startRhythmRound, 1000);
  }
}

function initMemoryGame() {
  const spot = miniGame.spot;
  const figures = spot.figures.slice(0, 6);
  const pairs = figures.map(f => ({ name: f.name, desc: f.role }));
  const cards = [];
  pairs.forEach((p, i) => {
    cards.push({ id: "n" + i, text: p.name, matchId: i, type: "name" });
    cards.push({ id: "d" + i, text: p.desc, matchId: i, type: "desc" });
  });
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  miniGame.state = { cards, flipped: [], matched: [], moves: 0, score: 0, max: pairs.length * 10 };
  renderMemoryGame();
}

function renderMemoryGame() {
  const s = miniGame.state;
  miniGameArea.innerHTML = `
    <div class="mg-memory">
      <div class="mg-topbar">
        <span>📍 ${miniGame.spot.name} · 红色记忆翻牌</span>
        <span>配对：${s.matched.length / 2}/${s.max / 10} | 步数：${s.moves} | 得分：${s.score}</span>
      </div>
      <div class="mg-memory-grid">
        ${s.cards.map((c, i) => {
          const isFlipped = s.flipped.includes(i) || s.matched.includes(i);
          return `
            <div class="mg-card ${isFlipped ? 'mg-flipped' : ''}" onclick="flipCard(${i})">
              <div class="mg-card-inner">
                <div class="mg-card-front">?</div>
                <div class="mg-card-back ${c.type}">${c.text}</div>
              </div>
            </div>
          `;
        }).join("")}
      </div>
      <div class="mg-rhythm-tip">将历史人物与他们的身份/事迹正确配对！</div>
    </div>
  `;
}

function flipCard(i) {
  const s = miniGame.state;
  if (s.flipped.includes(i) || s.matched.includes(i) || s.flipped.length >= 2) return;
  playSound("click");
  s.flipped.push(i);
  renderMemoryGame();
  if (s.flipped.length === 2) {
    s.moves++;
    const [a, b] = s.flipped;
    if (s.cards[a].matchId === s.cards[b].matchId && s.cards[a].type !== s.cards[b].type) {
      s.matched.push(a, b);
      s.score += 10;
      s.flipped = [];
      setTimeout(() => {
        playSound("correct");
        renderMemoryGame();
        if (s.matched.length === s.cards.length) {
          playSound("win");
          const msg = `用 ${s.moves} 步完成全部配对！红色记忆已深植心中。`;
          showMiniGameResult(s.score, s.max, "记忆翻牌完成", msg, s.moves <= 12 ? "🏆" : "🎖️");
        }
      }, 400);
    } else {
      playSound("wrong");
      setTimeout(() => { s.flipped = []; renderMemoryGame(); }, 800);
    }
  }
}

    }
  }, 1500);
  setTimeout(spawnBomber, 2000);
}

function updateLogisticsHUD() {
  const topbar = miniGameArea.querySelector(".mg-topbar span:last-child");
  if (topbar) topbar.textContent = `🚚 已运：${miniGame.state.delivered} | 💥 损失：${miniGame.state.lost} | ⏱ ${miniGame.state.time}s`;
}

function endLogisticsGame() {
  if (miniGame.timer) { clearInterval(miniGame.timer); miniGame.timer = null; }
  const s = miniGame.state;
  const msg = s.delivered >= 15 ? "生命线守护者！大量援华物资安全送达前线！" : s.delivered >= 8 ? "运输任务完成不错，继续保障抗战生命线！" : "物资损失较大，抗战生命线需要更好的保护！";
  showMiniGameResult(s.delivered, s.max, "运输任务结束", msg, s.delivered >= 15 ? "🏆" : s.delivered >= 8 ? "🎖️" : "🚚");
}

// 绑定场景小游戏按钮
startMiniGameBtn.addEventListener("click", handleStartMiniGame);

// 景区选择变化时更新推荐类型
spotSelect.addEventListener("change", () => {
  const spot = knowledgeBase[spotSelect.value];
  if (spot) {
    const autoOption = typeSelect.querySelector('option[value="自动判断"]');
    if (autoOption) {
      autoOption.textContent = `自动判断（推荐：${spot.recommendedScript}）`;
    }
  }
});

// 初始化
initSpotSelect();

</script>
